name: Build & Push Docker Image

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ── Step 1: generate a single shared timestamp ──────────────────────────────
  prepare:
    name: Generate build metadata
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.tag.outputs.ts }}
    steps:
      - id: tag
        run: echo "ts=$(date -u +'%d%m%Y.%H%M%S')" >> "$GITHUB_OUTPUT"

  # ── Step 2a: native amd64 build ─────────────────────────────────────────────
  build-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: jsrankit/wpmanager:amd64-${{ needs.prepare.outputs.ts }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  # ── Step 2b: native arm64 build (runs in parallel with amd64) ───────────────
  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-24.04-arm   # GitHub-hosted native ARM64 runner
    needs: prepare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: jsrankit/wpmanager:arm64-${{ needs.prepare.outputs.ts }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  # ── Step 3: merge into a single multi-arch manifest ─────────────────────────
  merge-manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: [prepare, build-amd64, build-arm64]
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge and push manifest
        run: |
          TS="${{ needs.prepare.outputs.ts }}"
          docker buildx imagetools create \
            --tag jsrankit/wpmanager:latest \
            --tag jsrankit/wpmanager:${TS} \
            jsrankit/wpmanager:amd64-${TS} \
            jsrankit/wpmanager:arm64-${TS}

